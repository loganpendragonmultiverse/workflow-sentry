[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-sentry"
version = "1.2.0"
description = "Audit GitHub Actions workflows locally for high-impact security risks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["build>=1.3,<2", "mypy>=1.15,<3", "pip-audit>=2.9,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "types-PyYAML>=6.0.12"]

[project.scripts]
workflow-sentry = "workflow_sentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py310"
[tool.mypy]
python_version = "3.10"
strict = true
[tool.coverage.run]
omit = ["src/*/__main__.py"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=workflow_sentry --cov-branch --cov-report=term-missing --cov-fail-under=90"
